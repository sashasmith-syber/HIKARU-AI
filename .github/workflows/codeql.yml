# .github/workflows/codeql.yml
# AIT Enterprise — CodeQL Static Analysis
# Red Team 2026: runs on push, PR, and weekly scheduled deep scan
# Languages auto-detected: typescript, python, javascript

name: CodeQL Security Scan

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Full deep scan every Sunday 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
        # Add 'actions' if you have GitHub Actions workflows to scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for accurate analysis

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Red Team 2026: use security-extended + security-and-quality suites
          queries: >-
            security-extended,
            security-and-quality
          config: |
            paths-ignore:
              - 'node_modules'
              - 'dist'
              - 'build'
              - '.next'
              - 'coverage'
              - '**/*.test.ts'
              - '**/*.spec.ts'
              - '**/*.test.py'

      # TypeScript: build step needed for accurate analysis
      - name: Setup Node (TypeScript only)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (TypeScript only)
        if: matrix.language == 'javascript-typescript'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json found, skipping install"
          fi

      # Python: setup for accurate analysis
      - name: Setup Python (Python only)
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (Python only)
        if: matrix.language == 'python'
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --break-system-packages || true
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          # Fail the workflow if HIGH or CRITICAL severity issues are found
          # Remove this to make it non-blocking (advisory only)
          # wait-for-processing: true

      # Upload SARIF results even on failure for review
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
        continue-on-error: true
