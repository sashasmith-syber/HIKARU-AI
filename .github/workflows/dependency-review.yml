# .github/workflows/dependency-review.yml
# AIT Enterprise — Dependency Review Gate
# Blocks merging of any PR that introduces packages with known CVEs
# Red Team 2026: fail on HIGH+, warn on MODERATE

name: Dependency Review

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'package*.json'
      - 'requirements*.txt'
      - 'Pipfile*'
      - 'poetry.lock'
      - 'pyproject.toml'

permissions:
  contents: read
  pull-requests: write    # to post review comments

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # BLOCK the PR if any introduced package has HIGH or CRITICAL severity
          fail-on-severity: high

          # Also flag licenses that are incompatible with proprietary use
          deny-licenses: >-
            GPL-2.0,
            GPL-3.0,
            AGPL-3.0,
            LGPL-2.1,
            LGPL-3.0,
            CDDL-1.0,
            EPL-1.0,
            EPL-2.0

          # Warn on MODERATE but don't block
          warn-on-openssf-scorecard-level: 5

          # Comment on PR with findings
          comment-summary-in-pr: always

          # Fail if a package was yanked / unpublished (supply chain)
          warn-only: false

      - name: Post summary comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **AIT Security Gate — Dependency Review FAILED**\n\nThis PR introduces packages with HIGH or CRITICAL severity CVEs.\n\nPlease review the Dependency Review action output above and upgrade or replace the affected packages before merging.\n\n_HIKARU Sanctuary Protocol — Zero tolerance for known vulnerabilities in main branch._'
            })
