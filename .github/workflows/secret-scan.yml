# .github/workflows/secret-scan.yml
# AIT Enterprise — Secret & Credential Leak Prevention
# Red Team 2026: dual-layer scanning (TruffleHog + Gitleaks)
# Runs on every push and PR — blocks before secrets reach remote

name: Secret Scan

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  trufflehog:
    name: TruffleHog — verified secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history scan

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # On push: scan only new commits
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          # Only report verified secrets (reduces false positives)
          extra_args: --only-verified --fail

  gitleaks:
    name: Gitleaks — pattern-based scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # needed for org scan
        with:
          args: >-
            --verbose
            --redact
            --no-git

  notify-on-leak:
    name: Alert on leak detection
    needs: [trufflehog, gitleaks]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔴 **CRITICAL: Secret/Credential Leak Detected**\n\n' +
                    'A verified secret or credential pattern was found in this PR.\n\n' +
                    '**Immediate actions required:**\n' +
                    '1. Do NOT merge this PR\n' +
                    '2. Identify the leaked credential in the scan output above\n' +
                    '3. **Rotate the credential immediately** — assume it is compromised\n' +
                    '4. Remove the secret from git history using `git filter-branch` or BFG\n' +
                    '5. Re-scan after cleanup\n\n' +
                    '_AIT PROTOS-1 Sanctuary Protocol — Leaked credentials must be treated as compromised._'
            })
